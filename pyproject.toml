[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench2agent"
version = "0.3.0.dev0"
description = "Ask which benchmarks researchers use, how usage changes, and which new benchmarks are adopted"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The SERVING layer is stdlib-only by design — it must run on machines that
# cannot run the build pipeline (Windows, no GPU). Pipeline deps live in .venv.
dependencies = []

[project.urls]
Repository = "https://github.com/hyunyoungnam/Bench2Agent"
Documentation = "https://github.com/hyunyoungnam/Bench2Agent/blob/main/docs/terminal.md"
Issues = "https://github.com/hyunyoungnam/Bench2Agent/issues"
Changelog = "https://github.com/hyunyoungnam/Bench2Agent/releases"

[project.scripts]
bench2agent = "bench2agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bench2agent*"]

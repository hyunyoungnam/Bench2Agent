name: BenchTrend package

on:
  push:
    paths: ["src/bellwether/**", "src/benchtrend/**", "tests/**", "pyproject.toml", "docs/terminal.md", "scripts/smoke_terminal.py", ".github/workflows/package.yml"]
  pull_request:
    paths: ["src/bellwether/**", "src/benchtrend/**", "tests/**", "pyproject.toml", "docs/terminal.md", "scripts/smoke_terminal.py", ".github/workflows/package.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and exercise wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/benchtrend-wheel"
          "$RUNNER_TEMP/benchtrend-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/benchtrend-wheel/bin/python" scripts/smoke_terminal.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchtrend-package-python-${{ matrix.python }}
          path: dist/

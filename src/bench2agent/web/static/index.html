<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench2Agent</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --ok:#1a7f37; --bad:#b42318; --accent:#2a5bd7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --fg:#eaeaea; --muted:#9a9a9a; --line:#333; --ok:#3fb950; --bad:#f08080; --accent:#79a6ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  header { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  textarea { width:100%; min-height:64px; box-sizing:border-box; }
  button { cursor:pointer; } button.primary { border-color: var(--accent); color: var(--accent); }
  button.current { background: var(--line); }
  .turn { border-top:1px solid var(--line); padding:12px 0; }
  .q { font-weight:600; }
  .quote { border-left:3px solid var(--line); padding:4px 8px; margin:6px 0; }
  .quote.ok { border-color: var(--ok);} .quote.bad { border-color: var(--bad);}
  .fig.ok { color: var(--ok);} .fig.bad { color: var(--bad);} .fig.na { color: var(--muted);}
  details { margin:6px 0; } summary { cursor:pointer; color: var(--muted); }
  .events { font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .error { color: var(--bad); }
  #convs { display:flex; gap:6px; flex-wrap:wrap; } #convs button { font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bench2Agent</h1>
    <span class="muted">Which benchmarks the field evaluates on, from the papers. Counts are papers, never quality.</span>
  </header>

  <section id="login" class="row" hidden>
    <span class="muted">This host needs an invite code.</span>
    <input id="invite" type="password" placeholder="invite code" size="28">
    <input id="name" placeholder="your name" size="18">
    <button id="signin" class="primary">Continue</button>
    <span id="loginStatus" class="muted"></span>
  </section>

  <section id="setup" hidden>
    <div class="row"><span id="who" class="muted"></span></div>
    <div id="connectors" class="row"></div>
    <div class="row">
      <select id="connector"></select>
      <span id="apiOptions">
        <select id="provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select>
        <input id="model" placeholder="model id (optional)" size="26">
        <input id="modelKey" type="password" placeholder="your model API key (sent with each question through this backend to the provider, never stored)" size="44" hidden>
      </span>
      <select id="language"><option value="auto">language: auto</option><option value="en">English</option><option value="ko">한국어</option></select>
      <button id="newConv" class="primary">New conversation</button>
    </div>
    <div id="convs"></div>
  </section>

  <section id="chat" hidden>
    <div class="muted" id="convMeta"></div>
    <div id="turns"></div>
    <div class="row" style="flex-direction:column; align-items:stretch">
      <textarea id="question" placeholder="What benchmarks are researchers using in robotics lately?"></textarea>
      <div class="row"><button id="askBtn" class="primary">Ask</button><button id="cancelBtn" hidden>Cancel</button><span id="status" class="muted"></span></div>
      <div id="events" class="events"></div>
    </div>
  </section>
</div>
<script src="/render.js"></script>
<script src="/api/app.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = B2ARender.esc;
  const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;

  function renderTurn(t) {
    const parts = t.segs.map(s => {
      if (s.t === "p") return B2ARender.toHtml(s.s);
      if (s.t === "c") {
        const where = [s.venue, s.year].filter(Boolean).join(" ");
        const title = s.url ? link(s.url, s.title || s.paper_id) : esc(s.title || "");
        return `<div class="quote ${s.v ? "ok" : "bad"}">“${esc(s.q)}” <span class="muted">— ${title}${where ? ", " + esc(where) : ""} · ${s.v ? "verified in the paper" : "NOT found in the paper"}</span></div>`;
      }
      if (s.t === "n") return `<span class="fig ${s.v}" title="${esc(s.tool)} ${esc(s.arg)}">${esc(s.s)}</span>`;
      return esc(s.s || "");
    }).join("");
    const v = t.verified || {};
    const on = (t.on && t.on.benchmarks) || {};
    const tm = t.timing || {};
    const timing = tm.duration_ms != null ? ` · ${(tm.duration_ms/1000).toFixed(1)} s (model ${((tm.model_ms||0)/1000).toFixed(1)}, tools ${((tm.tool_ms||0)/1000).toFixed(1)}, checks ${((tm.verify_ms||0)/1000).toFixed(1)}), ${tm.tool_calls||0} tool calls` : "";
    return `<div class="turn"><div class="q">${esc(t.q)}</div><div>${parts}</div>
      <details><summary>Sources and checks: ${v.passed||0}/${v.checked||0} quotes verified, ${v.fpassed||0}/${v.fchecked||0} figures recomputed · data revision ${esc(on.revision||on.snapshot_id||"?")}${timing}</summary>
      <div class="muted">Tools used: ${(t.trail||[]).map(x => esc(x.name + " " + x.arg)).join("<br>") || "none"}<br>Source: ${esc(on.source||"")}, generated ${esc(on.generated_at||"")}</div></details></div>`;
  }

  const view = {
    showUser(me) {
      $("login").hidden = true; $("setup").hidden = false;
      $("who").textContent = `${me.attempts_today}/${me.turns_per_day} questions today`;
      $("modelKey").hidden = me.credentials !== "user";
    },
    showConnectors(list, localMode) {
      $("connectors").innerHTML = list.map(c => {
        const state = !c.enabled ? `<span class="muted">unavailable here: ${esc(c.disabled_reason || "")}</span>`
          : c.connected ? `<span class="fig ok">connected${c.account ? " · " + esc(c.account) : ""}</span>`
          : `<span class="fig bad">not connected</span>${c.login && c.login.command ? ` <span class="muted">· run <code>${esc(c.login.command)}</code> on this machine, then reload</span>` : ""}`;
        return `<div><strong>${esc(c.label)}</strong> ${state}</div>`;
      }).join("");
      const usable = list.filter(c => c.enabled && (c.connected || c.name === "api"));
      $("connector").innerHTML = usable.map(c => `<option value="${esc(c.name)}">${esc(c.label)}</option>`).join("")
        || `<option value="">no connection available</option>`;
      const sync = () => { $("apiOptions").hidden = $("connector").value !== "api"; };
      $("connector").onchange = sync; sync();
      $("newConv").disabled = usable.length === 0;
    },
    showSignedOut(message) { $("setup").hidden = true; $("chat").hidden = true; $("login").hidden = false; $("loginStatus").textContent = message || ""; },
    showList(convs, current, running) {
      $("convs").innerHTML = convs.map(c => `<button data-cid="${esc(c.cid)}" class="${c.cid === current ? "current" : ""}" title="revision ${esc(c.revision)}">${esc(c.title)}${running.includes(c.cid) ? " …" : ""}</button>`).join("");
      $("convs").querySelectorAll("button").forEach(b => b.onclick = () => app.open(b.dataset.cid).catch(e => { $("status").textContent = e.message; }));
    },
    showConversation(c, busy) {
      $("chat").hidden = false;
      $("convMeta").textContent = `${c.connector === "api" || !c.connector ? c.provider + " · " + c.model : c.connector} · data revision ${c.revision}`;
      $("turns").innerHTML = c.turns.map(renderTurn).join("");
      $("events").textContent = ""; $("status").textContent = busy ? "a question is running in this conversation…" : "";
      view.setBusy(c.cid, busy);
    },
    setBusy(cid, busy) {           // null: the finished job belongs to a conversation that is not open
      if (busy === null) return;
      $("askBtn").disabled = busy; $("cancelBtn").hidden = !busy;
    },
    showEvent(cid, ev) { $("events").textContent += `tool ${ev.name} ${JSON.stringify(ev.arguments)}\n`; },
    appendTurn(cid, turn) { $("turns").insertAdjacentHTML("beforeend", renderTurn(turn)); $("question").value = ""; $("status").textContent = "answer verified and saved"; },
    showError(cid, message, cancelled) { $("status").innerHTML = `<span class="${cancelled ? "muted" : "error"}">${esc(message)}</span>`; },
    showStatus(cid, message) { $("status").textContent = message; },
    notifyFinished(cid) { $("status").textContent = "an answer finished in another conversation; open it to read it"; },
  };

  const app = B2AApp.create({fetch: (p, o) => fetch(p, o), ndjson: B2AApp.ndjson, abort: () => new AbortController(), view});
  app.start();
  $("signin").onclick = () => app.login($("invite").value.trim(), $("name").value.trim()).catch(e => { $("loginStatus").textContent = e.message; });
  $("newConv").onclick = () => app.newConversation($("provider").value, $("model").value, $("language").value, $("connector").value).catch(e => { $("status").textContent = e.message; });
  $("cancelBtn").onclick = () => app.cancel(app.state.cid).catch(e => { $("status").textContent = e.message; });
  $("askBtn").onclick = () => { const q = $("question").value.trim(); if (!q) return; $("events").textContent = ""; $("status").textContent = "asking…";
    app.ask(q, $("modelKey").value).catch(e => { $("status").textContent = e.message; }); };
})();
</script>
</body>
</html>
